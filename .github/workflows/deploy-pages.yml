name: Публикация GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить файлы карты
        uses: actions/checkout@v4
      - name: Настроить Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Подготовить статический сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4

